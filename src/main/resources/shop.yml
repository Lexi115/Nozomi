shop:
  gui:
    title: '–• &4Shop •–'
    rows: 1
    item-slots:
      - 2
      - 4
      - 6
    navigation:
      previous-page:
        name: '&cPrevious page'
        lore:
          - '&7Go to previous page.'
        material: ARROW
      next-page:
        name: '&aNext page'
        lore:
          - '&7Go to next page.'
        material: ARROW
      current-page:
        name: '&ePage %page% of %totalPages%'
        lore:
          - '&7You are on page &e%page%.'
        material: COMPASS

  items:
    stone:
      name: Stone
      material: STONE
      amount: 16
      rewards:
        - cmd:tell %player% Hai venduto stone, bravo guagliò!
        - cmd:give %player% minecraft:iron_ingot 2
        - money:5

    oak-log:
      name: Oak Log
      material: OAK_LOG
      amount: 8
      rewards:
        - cmd:tell %player% Hai spacciato legna, sei un boscaiolo ormai.
        - cmd:xp add %player% 5 points

    iron-ingot:
      name: Iron Ingot
      material: IRON_INGOT
      amount: 4
      rewards:
        - cmd:tell %player% Ferro fresco fresco!
        - cmd:give %player% minecraft:emerald 1

    gold-ingot:
      name: Gold Ingot
      material: GOLD_INGOT
      amount: 2
      rewards:
        - cmd:tell %player% Uè, oro pesante!
        - cmd:gamemode adventure

    diamond:
      name: '&b&lDiamond'
      display-name: '%name%&r &6x&e%amount%'
      material: DIAMOND
      amount: 1
      lore:
        - '&aBeautiful %name%'
        - 'Just give me &6%amount% &fof them'
      rewards:
        - cmd:tell %player% O compà, vendi i diamanti? Sei pazzo?
        - cmd:give %player% minecraft:experience_bottle 3

    coal:
